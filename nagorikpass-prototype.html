  const f = S.ui.hist_f || {};
  const from = f.from || '2026-11-01', to = f.to || TODAY;
  const list = filterVisits(DB.visits.filter(v=>v.date>=from && v.date<=to && !(v.status==='expected' && v.date>=TODAY)), 'hist')
    .sort((a,b)=> a.date===b.date ? toMin(b.inAt||b.arrival||'00:00')-toMin(a.inAt||a.arrival||'00:00') : a.date<b.date?1:-1);
  return pageHead('Visitor history', 'Every visit with its check-in and check-out times, the card used and the visitor type.',
    `<a class="btn" href="#/admin/reports">${icon('report','sm')}Make a report</a>`) + `
  <section class="panel">
    ${filterBar('hist',{status:['checked_in','checked_out','closed_card_lost','no_show','cancelled','not_permitted'], dates:true})}
    ${list.length?`<div class="table-wrap"><table class="t stack"><thead><tr><th>Date</th><th>Visitor</th><th>Visitor ID</th><th>Type</th><th>Guests</th><th>Invited by</th><th>Checked in</th><th>Checked out</th><th>Card</th><th>Status</th></tr></thead><tbody>
    ${list.map(v=>`<tr class="clickable" data-act="open-visit" data-id="${v.id}">
      <td data-label="Date" class="num" style="white-space:nowrap">${fmtShort(v.date)}</td>
      <td class="person" data-label="Visitor"><b>${esc(v.name)}</b><small class="num">${fmtPhone(v.phone)}${v.org?', '+esc(v.org):''}</small></td>
      <td data-label="Visitor ID">${vidCell(v)}</td>
      <td data-label="Type">${catTag(v.category)}</td>
      <td data-label="Guests" class="num">${v.guestsActual!=null?v.guestsActual:(v.guestsExpected||'0')}</td>
      <td data-label="Invited by">${hostCell(v)}</td>
      <td data-label="Checked in" class="num">${v.inAt?fmtTime(v.inAt):'<span class="muted">None</span>'}</td>
      <td data-label="Checked out" class="num">${v.outAt?fmtTime(v.outAt):'<span class="muted">None</span>'}</td>
      <td data-label="Card">${v.card?`<span style="display:inline-flex;gap:8px;align-items:center">${tag(v.card, v.status==='checked_in'?'issued':(v.status==='closed_card_lost'?v.cardEnd:'available'),'sm')}<small class="muted">${v.status==='checked_out'?'Returned':v.status==='checked_in'?'Out':'Not returned'}</small></span>`:'<span class="muted">None</span>'}</td>
      <td data-label="Status">${status(v.status)}</td></tr>`).join('')}
    </tbody></table></div><div class="table-foot"><span>${list.length} visits from ${fmtShort(from)} to ${fmtShort(to)}</span><span>Visitor data is kept indefinitely</span></div>`
    :`<div class="empty">${icon('history','big')}<h3>No visits in this range</h3><p>Widen the dates or clear the filters.</p><button class="btn" data-act="clear-filter" data-key="hist">Clear filters</button></div>`}
  </section>
  ${spec('Fields from PRD §6.6. The Visitor ID stays with the person across visits; the card column shows the reusable card used on that visit. Visitor ID format isn\'t decided; "V-0101" is an example.')}`;
});

/* ---------- Cards ---------- */
function cardHolder(c){ return DB.visits.find(v=>v.card===c.number && (v.status==='checked_in' || (v.status==='closed_card_lost' && ['lost','damaged'].includes(c.status)))); }
route('#/admin/cards', () => {
  const tab = S.ui.cardTab || 'rack';
  const cnt = s => DB.cards.filter(c=>c.status===s).length;
  const t = (v,l)=>`<button role="tab" aria-selected="${tab===v}" data-act="tab" data-key="cardTab" data-val="${v}">${l}</button>`;
  const assignments = DB.visits.filter(v=>v.card && v.inAt).sort((a,b)=> a.date===b.date ? toMin(b.inAt)-toMin(a.inAt) : a.date<b.date?1:-1);
  let body = '';
  if(tab==='rack'){
    body = `<div class="rack">${DB.cards.map(c=>{ const h = cardHolder(c); return `<button class="rack-item" data-act="open-card" data-id="${c.id}">${tag(c.number,c.status)}<small>${h&&c.status==='issued'?esc(h.name.split(' ').slice(0,2).join(' ')):STATUS_LABEL[c.status]}</small></button>`; }).join('')}</div>`;
  } else if(tab==='monitor'){
    const live = DB.visits.filter(v=>v.card && v.date===TODAY && v.inAt).sort((a,b)=>toMin(b.inAt)-toMin(a.inAt));
    body = `<div class="table-wrap"><table class="t stack"><thead><tr><th>Card</th><th>Visitor</th><th>Visitor ID</th><th>Checked in</th><th>Card status</th><th>Check-out</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>
      ${live.map(v=>`<tr><td data-label="Card">${tag(v.card, v.status==='checked_in'?'issued':'available','sm')}</td><td class="person" data-label="Visitor"><b>${esc(v.name)}</b><small>Seeing ${esc(hostName(v))}</small></td><td data-label="Visitor ID">${vidCell(v)}</td><td data-label="Checked in" class="num">${fmtTime(v.inAt)}</td><td data-label="Card status">${status(v.status==='checked_in'?'issued':'available')}</td><td data-label="Check-out">${v.outAt?`Done at ${fmtTime(v.outAt)}`:'<span class="muted">Not yet</span>'}</td><td class="actions-cell">${v.status==='checked_in'?`<button class="btn sm" data-act="resolve-loss" data-id="${v.id}">Card lost?</button>`:''}</td></tr>`).join('')}
    </tbody></table></div>`;
  } else {
    body = `<div class="table-wrap"><table class="t stack"><thead><tr><th>Card</th><th>Visitor</th><th>Issued</th><th>Returned</th><th>Result</th></tr></thead><tbody>
      ${assignments.map(v=>{ const st = cardState(v); return `<tr><td data-label="Card">${tag(v.card, st==='issued'?'issued':st==='returned'?'available':st,'sm')}</td><td class="person" data-label="Visitor"><b>${esc(v.name)}</b><small>${vcode(v)?esc(vcode(v)):'No Visitor ID'}</small></td><td data-label="Issued" class="num">${fmtShort(v.date)}, ${fmtTime(v.inAt)}</td><td data-label="Returned" class="num">${v.outAt?`${fmtShort(v.date)}, ${fmtTime(v.outAt)}`:'<span class="muted">Not returned</span>'}</td><td data-label="Result">${st==='issued'?status('issued','Still out'):st==='returned'?status('checked_out','Returned'):status(st, st==='lost'?'Lost':'Damaged')}</td></tr>`; }).join('')}
    </tbody></table></div>`;
  }
  return pageHead('Visitor cards', 'Register cards, see who holds each one, and close out lost or damaged cards.',
    `<a class="btn" href="#/admin/cards/import">${icon('upload','sm')}Import cards</a><button class="btn primary" data-act="add-card">${icon('plus','sm')}Add card</button>`) + `
  <div class="panel" style="margin-bottom:18px;padding:14px 18px"><div class="legend">
    <span>${tag('VC-00','available','sm').replace('>00<','>&nbsp;<')}<b class="num" style="color:var(--ink)">${cnt('available')}</b> available</span>
    <span>${tag('VC-00','issued','sm').replace('>00<','>&nbsp;<')}<b class="num" style="color:var(--ink)">${cnt('issued')}</b> issued</span>
    <span>${tag('VC-00','lost','sm').replace('>00<','>&nbsp;<')}<b class="num" style="color:var(--ink)">${cnt('lost')+cnt('damaged')}</b> lost or damaged</span>
    <span>${tag('VC-00','retired','sm').replace('>00<','>&nbsp;<')}<b class="num" style="color:var(--ink)">${cnt('retired')}</b> retired</span>
  </div></div>
  <section class="panel"><div class="tabs" role="tablist">${t('rack','Card rack')}${t('monitor','Today\'s monitoring')}${t('history','Issue and return history')}</div>${body}</section>
  ${spec('Cards are reusable: after a confirmed return a card is Available for the next visitor. A card number is never a Visitor ID. HR/Admin can correct a card number and its history is kept (OQ-7). Lost, Damaged and Retired come from DEC-Q4 and DEC-J10.')}`;
});
ACT['open-card'] = el => {
  const c = DB.cards.find(x=>x.id===el.dataset.id); const h = cardHolder(c);
  const hist = DB.visits.filter(v=>v.card===c.number && v.inAt).sort((a,b)=>a.date<b.date?1:-1);
  openDrawer(`<div class="drawer-head">${tag(c.number,c.status)}<div class="grow"><h2>Card ${c.number}</h2><p>Registered ${c.added}</p><div style="margin-top:8px">${status(c.status)}</div></div><button class="icon-btn" data-act="close" aria-label="Close">${icon('x')}</button></div>
  <div class="drawer-body">

route('#/admin/reports', () => {

    <div class="field"><label for="rh">Invited by</label><select class="select" id="rh" data-change="filter" data-key="rep" data-k="host"><option value="">Anyone</option>${DB.employees.map(e=>`<option value="${e.id}" ${f.host===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div>
  </div>${chips.length?`<div class="chips" style="margin-top:12px">${chips.map(([k,l])=>`<span class="chip">${esc(l)}<button data-act="rm-chip" data-k="${k}" aria-label="Remove filter ${esc(l)}">${icon('x','sm')}</button></span>`).join('')}</div>`:''}</div></section>
  <section class="panel">

    ${list.length?`<div class="visit-cards">${list.map(card).join('')}</div>`:`<div class="empty">${icon('calendar','big')}<h3>${tab==='up'?'No visitors coming up':'No past visitors yet'}</h3><p>${tab==='up'?'Add a visitor and reception will be ready for them.':'Visitors you\'ve had will be listed here.'}</p>${tab==='up'?`<a class="btn primary" href="#/me/new">${icon('plus','sm')}Add new visitor</a>`:''}</div>`}
  </section>
  ${spec('"Own" visitors are ones you registered or that name you in Invited By. You can edit or cancel them until check-in (DEC-Q10). Employees don\'t receive notifications and don\'t link Telegram (OQ-3, OQ-4); HR/Admin is notified at check-in.')}`;
});
route('#/me/new', () => pageHead('Add new visitor', 'Tell reception who\'s coming. They\'ll be in Expected Visitors on the date you choose.', '', {h:'#/me/visitors', label:'My visitors'}) + `
  <form class="panel" data-form="visit-emp" style="max-width:860px" novalidate><div class="panel-body">${visitFields({}, 'employee')}</div>
  <div class="modal-foot" style="border-radius:0 0 var(--r-md) var(--r-md)"><a class="btn" href="#/me/visitors">Cancel</a><button class="btn primary">Add visitor</button></div></form>`);
FORM['visit-emp'] = (f,d) => { const data = readVisitForm(f,d,'employee'); if(!data) return;
  V(Object.assign(data, {status:'expected', source:'employee', registeredBy:ACCOUNTS.employee.name}));
  toast(`${data.name} added. Reception will see them in Expected Visitors.`); S.ui.meTab='up'; go('#/me/visitors'); };

render();
</script>
</body>
</html>
